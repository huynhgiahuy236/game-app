services:
  - type: web
    name: chi-muoi-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: /api/v1
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 90d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: ChiMuoiApp
      - key: CORS_ORIGINS
        value: ""
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: ALLOWED_IMAGE_TYPES
        value: image/jpeg,image/png,image/webp
      - key: SEED_USER_USERNAME
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false
      - key: SEED_USER_DISPLAY_NAME
        value: Mẹ
